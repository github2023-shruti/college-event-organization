<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Register</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">Student Registration</h1>
      <div class="nav">
        <a class="button secondary" href="./student-login.html">Login</a>
        <a class="button secondary" href="./admin-register.html">Admin Register</a>
      </div>
    </div>

    <div class="card form">
      <div class="row">
        <div>
          <div class="label">Name</div>
          <input id="name" class="input" placeholder="Enter name">
        </div>
        <div>
          <div class="label">Email</div>
          <input id="email" class="input" placeholder="Enter email">
        </div>
        <div>
          <div class="label">Password</div>
          <input id="password" type="password" class="input" placeholder="Enter password">
        </div>
        <button id="registerBtn" class="button">Create Account</button>
        <div id="msg" class="subtitle"></div>
      </div>
    </div>
  </div>
  <script src="./js/utils.js"></script>
  <script src="./js/student-register.js"></script>
</body>
</html>
